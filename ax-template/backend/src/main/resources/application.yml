# Server
server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      cookie:
        same-site: none

# Application
spring:
  application:
    name: "FZ Cloud SaaS Console API"
  profiles:
    include: database
  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
      enabled: true

# File Upload
file:
  upload-dir: src/main/resources/static/uploads

# CORS
app:
  crypto:
    secret-key: fz-saas-console-aes256-secret-key-2026
  domain:
    web-url: http://localhost:3000
    api-url: http://localhost:8081
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:5173

# Health Check & Metrics
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
